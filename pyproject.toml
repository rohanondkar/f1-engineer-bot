[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-engineer"
version = "0.1.0"
description = "AI race engineer companion for F1 26 — voice + text team radio from live UDP telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "edge-tts>=6.1.0",
  "numpy>=1.26.0",
  "sounddevice>=0.5.0",
  "soundfile>=0.12.0",
  "scipy>=1.11.0",
  "keyboard>=0.13.5",
  "PySide6>=6.6.0",
  "faster-whisper>=1.0.0",
  "miniaudio>=1.59",
]

[project.optional-dependencies]
xtts = ["TTS>=0.22.0", "torch"]
dev = ["ruff>=0.6.0"]

[project.scripts]
f1-engineer = "f1_engineer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1_engineer = ["py.typed"]
